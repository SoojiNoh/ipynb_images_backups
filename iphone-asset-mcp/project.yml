name: AssetBridge

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  AssetBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.assetbridge
        PRODUCT_NAME: AssetBridge
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Xcode 에서 본인 팀으로 바꾸거나, 아래 줄을 지우고 GUI 에서 선택하세요.
        # DEVELOPMENT_TEAM: ABCDE12345
    info:
      path: AssetBridge-Info.plist
      properties:
        CFBundleDisplayName: AssetBridge
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

        # --- 로컬 네트워크: MCP 서버를 대기(listen)하려면 반드시 필요 ---
        NSLocalNetworkUsageDescription: >-
          같은 Wi-Fi 의 Claude 클라이언트가 접속할 수 있도록 이 기기에서 MCP 서버를 실행합니다.
        NSBonjourServices:
          - _mcp._tcp

        # --- 노출 도메인별 권한 문구 ---
        NSPhotoLibraryUsageDescription: >-
          연결된 Claude 클라이언트가 사진과 동영상을 검색하고 열람할 수 있도록 사진 라이브러리에 접근합니다.
        NSPhotoLibraryAddUsageDescription: >-
          앨범 생성 및 사진 추가 기능을 사용할 때 사진 라이브러리에 항목을 추가합니다.
        NSContactsUsageDescription: >-
          연락처를 검색하고 새 연락처를 추가하는 도구를 제공하기 위해 연락처에 접근합니다.
        NSCalendarsFullAccessUsageDescription: >-
          일정을 조회하고 새 일정을 만드는 도구를 제공하기 위해 캘린더에 접근합니다.
        NSCalendarsUsageDescription: >-
          일정을 조회하고 새 일정을 만드는 도구를 제공하기 위해 캘린더에 접근합니다.
        NSRemindersFullAccessUsageDescription: >-
          미리 알림을 조회하고 추가하는 도구를 제공하기 위해 미리 알림에 접근합니다.
        NSRemindersUsageDescription: >-
          미리 알림을 조회하고 추가하는 도구를 제공하기 위해 미리 알림에 접근합니다.
        NSLocationWhenInUseUsageDescription: >-
          현재 위치를 알려주는 도구를 제공하기 위해 앱 사용 중 위치에 접근합니다.
        NSMotionUsageDescription: >-
          걸음 수와 활동 요약을 알려주는 도구를 제공하기 위해 동작 및 피트니스 데이터에 접근합니다.
        NSAppleMusicUsageDescription: >-
          기기 음악 보관함을 검색하는 도구를 제공하기 위해 미디어 보관함에 접근합니다.

        # --- 잠금 화면에서도 서버를 유지하는 옵션(앱 내 토글, 기본 꺼짐) ---
        UIBackgroundModes:
          - audio

        # 내보낸 원본 파일을 파일 앱 / Finder 에서 꺼낼 수 있게 합니다.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
